name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: Deploy to VPS via Rsync (Password Auth)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          sshpass -e rsync -rlgoDzvc --delete -e "ssh -o StrictHostKeyChecking=no" dist/ root@${{ secrets.VPS_IP }}:/var/www/portofolio/dist
